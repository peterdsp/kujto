name: KujtoStudio
configs:
  Debug: debug
  Release: release
  Release-Direct: release
options:
  bundleIdPrefix: dev.peterdsp.kujto
  deploymentTarget:
    macOS: "14.0"
packages:
  KujtoCore:
    path: ../..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  KujtoStudio:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: KujtoCore
        product: KujtoCore
      - target: KujtoRulesExtension
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.kujto.studio
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kujto Studio
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release-Direct:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIRECT_BUILD
          INFOPLIST_KEY_SUFeedURL: https://kujto.peterdsp.dev/appcast.xml
          INFOPLIST_KEY_SUPublicEDKey: REPLACE_WITH_SPARKLE_ED_PUBLIC_KEY
          INFOPLIST_KEY_SUEnableAutomaticChecks: "YES"
    entitlements:
      path: App/KujtoStudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.dev.peterdsp.kujto
  KujtoRulesExtension:
    type: app-extension
    platform: macOS
    sources:
      - Extension
      - Shared
    dependencies:
      - package: KujtoCore
        product: KujtoCore
      - framework: XcodeKit.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.kujto.studio.RulesExtension
        INFOPLIST_FILE: Extension/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - $(DEVELOPER_DIR)/Library/Frameworks
    entitlements:
      path: Extension/KujtoRulesExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.dev.peterdsp.kujto
schemes:
  KujtoStudio:
    build:
      targets:
        KujtoStudio: [run, test, profile, analyze, archive]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  KujtoStudio-Direct:
    build:
      targets:
        KujtoStudio: [run, test, profile, analyze, archive]
    run:
      config: Debug
    profile:
      config: Release-Direct
    analyze:
      config: Debug
    archive:
      config: Release-Direct
