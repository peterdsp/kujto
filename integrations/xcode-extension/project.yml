name: KujtoStudio
options:
  bundleIdPrefix: dev.peterdsp.kujto
  deploymentTarget:
    macOS: "13.0"
packages:
  KujtoCore:
    path: ../..
targets:
  KujtoStudio:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: KujtoCore
        product: KujtoCore
      - target: KujtoRulesExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.kujto.studio
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kujto Studio
        INFOPLIST_KEY_LSMinimumSystemVersion: "13.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT"
    entitlements:
      path: App/KujtoStudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - group.dev.peterdsp.kujto
  KujtoRulesExtension:
    type: app-extension
    platform: macOS
    sources:
      - Extension
      - Shared
    dependencies:
      - package: KujtoCore
        product: KujtoCore
      - framework: XcodeKit.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.kujto.studio.RulesExtension
        INFOPLIST_FILE: Extension/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - $(DEVELOPER_DIR)/Library/Frameworks
    entitlements:
      path: Extension/KujtoRulesExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.dev.peterdsp.kujto
