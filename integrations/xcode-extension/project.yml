name: KujtoStudio
configs:
  Debug: debug
  Release: release
  Release-Direct: release
options:
  bundleIdPrefix: dev.peterdsp.kujto
  deploymentTarget:
    macOS: "14.0"
packages:
  KujtoCore:
    path: ../..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  KujtoStudio:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: App/EditorExtensionBundle
        buildPhase: resources
        type: folder
      - path: ../../skills
        buildPhase: resources
        type: folder
        name: SkillsCatalog
    dependencies:
      - package: KujtoCore
        product: KujtoCore
      # The native git panel (Glint's surface) plus the rules-in-commit fusion.
      - package: KujtoCore
        product: KujtoStudioUI
      - target: KujtoRulesExtension
      # embed:false keeps the privileged runtime helper out of the app bundle.
      # It is a non-sandboxed daemon (runs xcrun simctl outside the sandbox),
      # which the Mac App Store forbids: every bundled executable must carry
      # com.apple.security.app-sandbox=true, and this one by design cannot. The
      # target still builds so the Direct build can embed it via the post-build
      # script below (Release-Direct only). Without embed:false Xcode also
      # copies the tool into Contents/Resources, which tripped App Store
      # validation ("App sandbox not enabled").
      - target: KujtoRuntimeHelper
        embed: false
      # link:false keeps Sparkle out of the App Store (Release) binary: it is
      # linked only via Swift autolink where `import Sparkle` compiles, which
      # is gated behind DIRECT_BUILD (Release-Direct only). A strong link would
      # bake an LC_LOAD_DYLIB into every config; the App Store pipeline strips
      # the framework, and dyld would then abort at launch. The framework is
      # embedded for the Direct build in the post-build script below.
      - package: Sparkle
        product: Sparkle
        link: false
    postBuildScripts:
      - name: Add Bonjour services to Info.plist
        script: |
          # NSBonjourServices must be an array, which the generated-Info.plist
          # build settings cannot express, so inject it here. Runs before the
          # code-sign phase, so the signature covers the final plist. Required
          # for the Team Sync feature (MultipeerConnectivity) to discover peers
          # on macOS 15+.
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :NSBonjourServices" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _kujto-sync._tcp" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:1 string _kujto-sync._udp" "$PLIST"
      - name: Add Sparkle feed to Info.plist (Direct build only)
        script: |
          # The Direct build's auto-updater (Sparkle) reads SUFeedURL and
          # SUPublicEDKey from Info.plist. Xcode's generated plist ignores
          # INFOPLIST_KEY_* for these non-Apple keys, which is why the 1.0
          # Direct build errored with "You must specify the URL of the appcast
          # as the SUFeedURL key". Inject them here, before signing. App Store
          # (Release) builds do not link Sparkle, so this is Direct-only.
          if [ "$CONFIGURATION" != "Release-Direct" ]; then
            echo "Skipping Sparkle Info.plist keys for $CONFIGURATION"
            exit 0
          fi
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SUFeedURL string https://kujto.peterdsp.dev/appcast.xml" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string VXr6caNYzxLPSrRlZoDbOE0ny4X7SxWSUth3jf5QTyU=" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SUEnableAutomaticChecks bool true" "$PLIST"
      - name: Embed runtime helper (Direct build only)
        script: |
          # The privileged helper daemon and its LaunchDaemon plist ship only
          # in the Direct build. The App Store (Release) build must not bundle
          # a non-sandboxed executable, so this is intentionally skipped there.
          if [ "$CONFIGURATION" != "Release-Direct" ]; then
            echo "Skipping runtime helper embed for $CONFIGURATION"
            exit 0
          fi
          mkdir -p "$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/MacOS"
          mkdir -p "$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Library/LaunchDaemons"
          if [ -f "$BUILT_PRODUCTS_DIR/kujto-runtime-helper" ]; then
            cp -f "$BUILT_PRODUCTS_DIR/kujto-runtime-helper" \
                  "$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/MacOS/kujto-runtime-helper"
          fi
          cp -f "$SRCROOT/App/LaunchDaemons/dev.peterdsp.kujto.runtime.plist" \
                "$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Library/LaunchDaemons/"
      - name: Bundle kujto CLI (Direct build only)
        script: |
          # The direct build ships the kujto CLI in Contents/Resources so
          # onboarding can install it with one click (CLIInstaller). The App
          # Store build cannot bundle/extract a CLI (sandbox + review), so this
          # is Release-Direct only; there it falls back to copying the command.
          if [ "$CONFIGURATION" != "Release-Direct" ]; then
            echo "Skipping kujto CLI bundle for $CONFIGURATION"
            exit 0
          fi
          ROOT="$SRCROOT/../.."
          swift build -c release --product kujto --package-path "$ROOT" \
            || { echo "error: failed to build kujto CLI" >&2; exit 1; }
          BINDIR="$(swift build -c release --product kujto --package-path "$ROOT" --show-bin-path)"
          DEST="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Resources"
          mkdir -p "$DEST"
          cp -f "$BINDIR/kujto" "$DEST/kujto"
          chmod +x "$DEST/kujto"
          echo "Bundled kujto CLI from $BINDIR/kujto"
      - name: Embed Sparkle (Direct build only)
        script: |
          # The Direct build links Sparkle via autolink but link:false means
          # Xcode does not add it to the Embed Frameworks phase. Copy it in so
          # the @rpath load resolves at launch. The App Store (Release) build
          # never links Sparkle, so this is intentionally skipped there.
          if [ "$CONFIGURATION" = "Release-Direct" ]; then
            SRC="$BUILT_PRODUCTS_DIR/Sparkle.framework"
            DEST="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Frameworks"
            if [ -d "$SRC" ]; then
              mkdir -p "$DEST"
              rsync -a --delete "$SRC" "$DEST/"
            else
              echo "error: Sparkle.framework not found at $SRC" >&2
              exit 1
            fi
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.kujto.studio
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kujto Studio
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT"
        # Local-network usage for the Team Sync feature (MultipeerConnectivity
        # over Bonjour). Signed proposals only; nothing is installed without a
        # human adopting it.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kujto discovers teammates on your local network to exchange signed rule proposals. Nothing is installed without your review."
        INFOPLIST_KEY_NSBonjourServices: "_kujto-sync._tcp _kujto-sync._udp"
        MARKETING_VERSION: "1.1.3"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release-Direct:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIRECT_BUILD
          # NOTE: the Sparkle keys (SUFeedURL, SUPublicEDKey,
          # SUEnableAutomaticChecks) are NOT set here. Xcode's generated
          # Info.plist silently ignores INFOPLIST_KEY_* for non-Apple keys, so
          # these never reached the plist and the Direct build errored with
          # "You must specify the URL of the appcast as the SUFeedURL key". They
          # are injected with PlistBuddy in the post-build script below instead.
    entitlements:
      path: App/KujtoStudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # read-write so we can install editor extensions into
        # user-granted ~/.vscode/extensions and ~/.cursor/extensions folders
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        # network.server lets the Team Sync feature advertise over Bonjour.
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          - YTS4KJBX3P.dev.peterdsp.kujto
  KujtoRulesExtension:
    type: app-extension
    platform: macOS
    sources:
      - Extension
      - Shared
    dependencies:
      - package: KujtoCore
        product: KujtoCore
      - framework: XcodeKit.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.kujto.studio.RulesExtension
        INFOPLIST_FILE: Extension/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - $(DEVELOPER_DIR)/Library/Frameworks
    entitlements:
      path: Extension/KujtoRulesExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - YTS4KJBX3P.dev.peterdsp.kujto

  # Phase D2: privileged helper daemon that runs xcrun simctl outside the
  # app's sandbox. Registered via SMAppService.daemon from the main app.
  # The helper is bundled at Contents/MacOS/kujto-runtime-helper and its
  # launch plist at Contents/Library/LaunchDaemons/…plist.
  KujtoRuntimeHelper:
    type: tool
    platform: macOS
    sources:
      - Helper
    settings:
      base:
        PRODUCT_NAME: kujto-runtime-helper
        PRODUCT_BUNDLE_IDENTIFIER: dev.peterdsp.kujto.runtime
        SKIP_INSTALL: YES
schemes:
  KujtoStudio:
    build:
      targets:
        KujtoStudio: [run, test, profile, analyze, archive]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  KujtoStudio-Direct:
    build:
      targets:
        KujtoStudio: [run, test, profile, analyze, archive]
    run:
      config: Debug
    profile:
      config: Release-Direct
    analyze:
      config: Debug
    archive:
      config: Release-Direct
