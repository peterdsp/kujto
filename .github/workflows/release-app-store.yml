name: Release, App Store

# Ships the App Store flavor of Kujto Studio. Triggered by tags of the form
# vX.Y.Z-appstore. Archives with the Release configuration, exports for the
# App Store, and uploads to App Store Connect via altool.
#
# All signing identities live in the SIGNING_CERTIFICATES bundle.
# Authentication to App Store Connect is via the App Store Connect API key,
# so no Apple ID password is needed.

on:
  push:
    tags:
      - "v*-appstore"
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0)
        required: true

jobs:
  archive-and-upload:
    name: Archive and upload to App Store Connect
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            V="${V%-appstore}"
          else
            V="${{ inputs.version }}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: integrations/xcode-extension
        run: xcodegen generate

      - name: Import signing certificate bundle
        env:
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTS_B64: ${{ secrets.SIGNING_CERTIFICATES }}
          CERTS_PWD: ${{ secrets.SIGNING_CERTIFICATES_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          P12=$RUNNER_TEMP/certs.p12
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$CERTS_B64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$CERTS_PWD" -A \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/xcodebuild
          security set-key-partition-list -S "apple-tool:,apple:" -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect API key to disk
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      - name: Archive
        working-directory: integrations/xcode-extension
        run: |
          xcodebuild archive \
            -project KujtoStudio.xcodeproj \
            -scheme KujtoStudio \
            -configuration Release \
            -destination "platform=macOS" \
            -archivePath "$RUNNER_TEMP/KujtoStudio.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APP_STORE_TEAM_ID }} \
            MARKETING_VERSION=${{ steps.version.outputs.value }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Automatic

      - name: Export for App Store
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APP_STORE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KujtoStudio.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Upload to App Store Connect
        run: |
          PKG=$(ls "$RUNNER_TEMP/export"/*.pkg | head -n1)
          xcrun altool --upload-app --type macos --file "$PKG" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
