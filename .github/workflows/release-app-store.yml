name: Release, App Store

# Ships the App Store flavor of Kujto Studio. Triggered by tags of the form
# vX.Y.Z-appstore. Archives with the Release configuration, exports for the
# App Store, and uploads to App Store Connect via altool.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#
#   APP_STORE_TEAM_ID                Apple Team ID
#   APP_STORE_CONNECT_ISSUER_ID      App Store Connect API issuer
#   APP_STORE_CONNECT_KEY_ID         App Store Connect API key id
#   APP_STORE_CONNECT_PRIVATE_KEY    contents of the .p8 file
#   MAC_APP_STORE_CERTIFICATE        base64 of the .p12 (3rd Party Mac Developer Application)
#   MAC_APP_STORE_CERTIFICATE_PWD    password for the .p12
#   MAC_INSTALLER_CERTIFICATE        base64 of the .p12 (3rd Party Mac Developer Installer)
#   MAC_INSTALLER_CERTIFICATE_PWD    password for the .p12
#   KEYCHAIN_PASSWORD                any strong password, used only inside the runner

on:
  push:
    tags:
      - "v*-appstore"
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0)
        required: true

jobs:
  archive-and-upload:
    name: Archive and upload to App Store Connect
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            V="${V%-appstore}"
          else
            V="${{ inputs.version }}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: integrations/xcode-extension
        run: xcodegen generate
      - name: Import signing certificates
        env:
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_CERT: ${{ secrets.MAC_APP_STORE_CERTIFICATE }}
          APP_CERT_PWD: ${{ secrets.MAC_APP_STORE_CERTIFICATE_PWD }}
          PKG_CERT: ${{ secrets.MAC_INSTALLER_CERTIFICATE }}
          PKG_CERT_PWD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          for pair in "APP_CERT:APP_CERT_PWD" "PKG_CERT:PKG_CERT_PWD"; do
            NAME="${pair%%:*}"
            PWD="${pair##*:}"
            P12="$RUNNER_TEMP/${NAME}.p12"
            echo "${!NAME}" | base64 --decode > "$P12"
            security import "$P12" -k "$KEYCHAIN" -P "${!PWD}" -A -T /usr/bin/codesign -T /usr/bin/productsign
          done
          security set-key-partition-list -S "apple-tool:,apple:" -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
      - name: Archive
        working-directory: integrations/xcode-extension
        run: |
          xcodebuild archive \
            -project KujtoStudio.xcodeproj \
            -scheme KujtoStudio \
            -configuration Release \
            -destination "platform=macOS" \
            -archivePath "$RUNNER_TEMP/KujtoStudio.xcarchive" \
            DEVELOPMENT_TEAM=${{ secrets.APP_STORE_TEAM_ID }} \
            MARKETING_VERSION=${{ steps.version.outputs.value }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Export for App Store
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APP_STORE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KujtoStudio.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
      - name: Upload to App Store Connect
        env:
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          PKG=$(ls "$RUNNER_TEMP/export"/*.pkg | head -n1)
          xcrun altool --upload-app --type macos --file "$PKG" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
