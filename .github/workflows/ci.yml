name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift-tests:
    name: Swift build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build KujtoCore and CLI
        run: xcrun swift build
      - name: Run KujtoCore tests
        run: xcrun swift test

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./bin

  no-em-dash:
    name: No em-dash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid em-dash
        run: |
          # Allow em-dash inside backticks (rule docs use it to name the
          # character). Reject every other occurrence.
          MATCHES=$(grep -RIn --binary-files=without-match -P '(?<!`)—(?!`)' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.gif' \
            --exclude='ci.yml' . || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo
            echo "Em-dash found. Use commas, periods, parens, colons, or a regular hyphen."
            exit 1
          fi
          echo "No em-dash."

  applies-to-frontmatter:
    name: applies_to frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate file-scoped rule frontmatter
        run: |
          # Every memory/skill file that declares `applies_to` must list at
          # least one glob as a block-list (`  - "..."`). This keeps the
          # RuleIndex resolver fed with real, parseable patterns.
          FAIL=0
          while IFS= read -r -d '' f; do
            grep -q '^applies_to:' "$f" || continue
            ITEMS=$(awk '
              /^applies_to:[[:space:]]*$/ { inlist=1; next }
              inlist && /^---[[:space:]]*$/ { inlist=0; next }
              inlist && /^[[:space:]]*-[[:space:]]*[^[:space:]]/ { count++; next }
              inlist && /^[^[:space:]]/ { inlist=0 }
              END { print count + 0 }
            ' "$f")
            if [ "$ITEMS" -lt 1 ]; then
              echo "::error file=$f::applies_to present but no glob items found"
              FAIL=1
            fi
          done < <(find memory skills -name '*.md' -print0)
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "All applies_to frontmatter blocks list at least one glob."

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
        continue-on-error: true

  trailer-policy:
    name: Trailer policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify
        env:
          P64: Q28tQXV0aG9yZWQtQnk6W1s6c3BhY2U6XV0qLiooY2xhdWRlfGNvcGlsb3R8Z2VtaW5pfGN1cnNvcnxjb2RleHxjaGF0Z3B0fG9wZW5haXxhbnRocm9waWN8YmFyZCl8bm9yZXBseUAoYW50aHJvcGljfG9wZW5haXxnb29nbGUpfEdlbmVyYXRlZFtbOnNwYWNlOl1dd2l0aFtbOnNwYWNlOl1dKENsYXVkZXxDdXJzb3J8Q29waWxvdCk=
          EVT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          P=$(printf '%s' "$P64" | base64 -d)
          case "$EVT" in
            pull_request)
              RANGE="$BASE..$HEAD"
              ;;
            *)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                RANGE="HEAD~20..HEAD"
              else
                RANGE="$BEFORE..$AFTER"
              fi
              ;;
          esac
          HITS=$(git log "$RANGE" --pretty=format:"%H%n%B%n--END--" 2>/dev/null | grep -iE "$P" || true)
          if [ -n "$HITS" ]; then
            echo "Disallowed trailer found in a recent commit. Edit the message."
            exit 1
          fi
          echo "OK."
