name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./bin

  no-em-dash:
    name: No em-dash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid em-dash
        run: |
          # Allow em-dash inside backticks (rule docs use it to name the
          # character). Reject every other occurrence.
          MATCHES=$(grep -RIn --binary-files=without-match -P '(?<!`)—(?!`)' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.gif' \
            --exclude='ci.yml' . || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo
            echo "Em-dash found. Use commas, periods, parens, colons, or a regular hyphen."
            exit 1
          fi
          echo "No em-dash."

  bilingual-check:
    name: Bilingual sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Albanian and English sections
        run: |
          MISSING=0
          while IFS= read -r -d '' f; do
            if ! grep -q '^## Shqip' "$f"; then
              echo "::error file=$f::Missing '## Shqip' section"
              MISSING=1
            fi
            if ! grep -q '^## English' "$f"; then
              echo "::error file=$f::Missing '## English' section"
              MISSING=1
            fi
          done < <(find memory docs integrations -name '*.md' -print0)
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          echo "✓ All memory/docs/integrations files are bilingual."

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
        continue-on-error: true
