name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift-tests:
    name: Swift build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build KujtoCore and CLI
        run: xcrun swift build
      - name: Run KujtoCore tests
        run: xcrun swift test

  # The App Store (Release) and direct (Release-Direct) builds compile
  # different code and link differently: Sparkle is linked only where
  # DIRECT_BUILD is set, so a config-gated regression can pass the default
  # package build yet break the store build. Exercise both variants here so
  # it surfaces on the PR instead of at App Store submission time.
  studio-app:
    name: Build macOS Studio app (both variants)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: integrations/xcode-extension
        run: xcodegen generate
      - name: Build Release (App Store)
        working-directory: integrations/xcode-extension
        run: |
          xcodebuild -scheme KujtoStudio -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-release" \
            build CODE_SIGNING_ALLOWED=NO
      - name: Guard against Sparkle in the App Store binary
        run: |
          # Regression test for the 1.0(9) launch crash: the App Store
          # pipeline strips Sparkle.framework, so a strong link would leave a
          # dangling @rpath load command and dyld would abort at launch. The
          # Release binary must carry no Sparkle reference at all.
          BIN="$RUNNER_TEMP/dd-release/Build/Products/Release/KujtoStudio.app/Contents/MacOS/KujtoStudio"
          if otool -L "$BIN" | grep -qi sparkle; then
            echo "::error::Sparkle is linked into the Release (App Store) binary; it must be link:false so only the Direct build links it."
            otool -L "$BIN" | grep -i sparkle
            exit 1
          fi
          echo "No Sparkle load command in the App Store binary."
      - name: Guard against the privileged helper in the App Store bundle
        run: |
          # Regression test for the 1.0 App Store validation failure ("App
          # sandbox not enabled"): the non-sandboxed kujto-runtime-helper
          # daemon must never ship in the App Store build. It is embedded only
          # in the Direct build.
          APP="$RUNNER_TEMP/dd-release/Build/Products/Release/KujtoStudio.app"
          HITS=$(find "$APP" -name 'kujto-runtime-helper' 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::kujto-runtime-helper is bundled in the Release (App Store) app; it must be Direct-build only."
            echo "$HITS"
            exit 1
          fi
          echo "No runtime helper executable in the App Store bundle."
      - name: Build Release-Direct (Ko-fi, links + embeds Sparkle)
        working-directory: integrations/xcode-extension
        run: |
          xcodebuild -scheme KujtoStudio-Direct -configuration Release-Direct \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-direct" \
            build CODE_SIGNING_ALLOWED=NO
      - name: Verify the Direct build embeds Sparkle
        run: |
          # The direct build must both link and embed Sparkle, or it would hit
          # the same dyld-missing crash the App Store build was rejected for.
          APP="$RUNNER_TEMP/dd-direct/Build/Products/Release-Direct/KujtoStudio.app"
          if [ ! -f "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" ]; then
            echo "::error::Direct build links Sparkle but does not embed Sparkle.framework; the @rpath load would fail at launch."
            exit 1
          fi
          echo "Direct build embeds Sparkle.framework."

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./bin

  no-em-dash:
    name: No em-dash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid em-dash
        run: |
          # Allow em-dash inside backticks (rule docs use it to name the
          # character). Reject every other occurrence.
          MATCHES=$(grep -RIn --binary-files=without-match -P '(?<!`)—(?!`)' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.gif' \
            --exclude='ci.yml' . || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo
            echo "Em-dash found. Use commas, periods, parens, colons, or a regular hyphen."
            exit 1
          fi
          echo "No em-dash."

  applies-to-frontmatter:
    name: applies_to frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate file-scoped rule frontmatter
        run: |
          # Every memory/skill file that declares `applies_to` must list at
          # least one glob as a block-list (`  - "..."`). This keeps the
          # RuleIndex resolver fed with real, parseable patterns.
          FAIL=0
          while IFS= read -r -d '' f; do
            grep -q '^applies_to:' "$f" || continue
            ITEMS=$(awk '
              /^applies_to:[[:space:]]*$/ { inlist=1; next }
              inlist && /^---[[:space:]]*$/ { inlist=0; next }
              inlist && /^[[:space:]]*-[[:space:]]*[^[:space:]]/ { count++; next }
              inlist && /^[^[:space:]]/ { inlist=0 }
              END { print count + 0 }
            ' "$f")
            if [ "$ITEMS" -lt 1 ]; then
              echo "::error file=$f::applies_to present but no glob items found"
              FAIL=1
            fi
          done < <(find memory skills -name '*.md' -print0)
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "All applies_to frontmatter blocks list at least one glob."

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
        continue-on-error: true

  trailer-policy:
    name: Trailer policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify
        env:
          P64: Q28tQXV0aG9yZWQtQnk6W1s6c3BhY2U6XV0qLiooY2xhdWRlfGNvcGlsb3R8Z2VtaW5pfGN1cnNvcnxjb2RleHxjaGF0Z3B0fG9wZW5haXxhbnRocm9waWN8YmFyZCl8bm9yZXBseUAoYW50aHJvcGljfG9wZW5haXxnb29nbGUpfEdlbmVyYXRlZFtbOnNwYWNlOl1dd2l0aFtbOnNwYWNlOl1dKENsYXVkZXxDdXJzb3J8Q29waWxvdCk=
          EVT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          P=$(printf '%s' "$P64" | base64 -d)
          case "$EVT" in
            pull_request)
              RANGE="$BASE..$HEAD"
              ;;
            *)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                RANGE="HEAD~20..HEAD"
              else
                RANGE="$BEFORE..$AFTER"
              fi
              ;;
          esac
          HITS=$(git log "$RANGE" --pretty=format:"%H%n%B%n--END--" 2>/dev/null | grep -iE "$P" || true)
          if [ -n "$HITS" ]; then
            echo "Disallowed trailer found in a recent commit. Edit the message."
            exit 1
          fi
          echo "OK."
