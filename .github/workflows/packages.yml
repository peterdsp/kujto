name: Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: 0.1.0

permissions:
  contents: read
  packages: write

jobs:
  swift:
    name: SwiftPM
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift package
        run: swift build

  github-packages:
    name: GitHub Packages, Gradle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Publish Gradle plugin to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          gradle publish -PkujtoVersion="$VERSION"

  flutter:
    name: Flutter package dry run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Validate pub package
        run: dart pub publish --dry-run
