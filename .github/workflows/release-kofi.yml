name: Release, Ko-fi (Direct)

# Ships the direct-distribution flavor of Kujto Studio. Triggered by tags of
# the form vX.Y.Z-direct. Archives with Release-Direct, signs with Developer
# ID, notarizes via the App Store Connect API key, packages a signed PKG,
# appends a Sparkle appcast entry, and publishes a GitHub Release.

on:
  push:
    tags:
      - "v*-direct"
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, notarize, package, release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            V="${V%-direct}"
          else
            V="${{ inputs.version }}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen and Sparkle CLI
        run: |
          brew install xcodegen
          SPARKLE_VER=2.7.0
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" \
            -o /tmp/sparkle.tar.xz
          tar -xf /tmp/sparkle.tar.xz -C /tmp
          sudo cp /tmp/bin/sign_update /tmp/bin/generate_keys /usr/local/bin/

      - name: Generate Xcode project
        working-directory: integrations/xcode-extension
        run: xcodegen generate

      - name: Import signing certificate bundle
        env:
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTS_B64: ${{ secrets.SIGNING_CERTIFICATES }}
          CERTS_PWD: ${{ secrets.SIGNING_CERTIFICATES_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          P12=$RUNNER_TEMP/certs.p12
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$CERTS_B64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$CERTS_PWD" -A \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/xcodebuild
          security set-key-partition-list -S "apple-tool:,apple:" -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect API key to disk
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      - name: Set up notarization profile via API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun notarytool store-credentials kujto-notary \
            --key ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER"

      - name: Archive
        working-directory: integrations/xcode-extension
        run: |
          xcodebuild archive \
            -project KujtoStudio.xcodeproj \
            -scheme KujtoStudio-Direct \
            -configuration Release-Direct \
            -destination "platform=macOS" \
            -archivePath "$RUNNER_TEMP/KujtoStudio.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            MARKETING_VERSION=${{ steps.version.outputs.value }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Automatic

      - name: Export .app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KujtoStudio.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Package PKG, notarize, staple
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION_NAME }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER_NAME }}
          NOTARY_KEYCHAIN_PROFILE: kujto-notary
        run: |
          APP="$RUNNER_TEMP/export/KujtoStudio.app"
          bash scripts/release/package-pkg.sh "$APP" "$RUNNER_TEMP/artifacts" "${{ steps.version.outputs.value }}"

      - name: Sign appcast entry and append
        env:
          SPARKLE_ED_PRIVATE_KEY_PATH: ${{ runner.temp }}/sparkle_ed.key
        run: |
          echo "${{ secrets.SPARKLE_ED_PRIVATE_KEY }}" | base64 --decode > "$SPARKLE_ED_PRIVATE_KEY_PATH"
          PKG=$(ls "$RUNNER_TEMP/artifacts"/*.pkg | head -n1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$PKG")"
          bash scripts/release/update-appcast.sh "$PKG" "${{ steps.version.outputs.value }}" "$URL"

      - name: Commit updated appcast
        run: |
          git config user.name  "kujto-bot"
          git config user.email "bot@kujto.peterdsp.dev"
          git add site/appcast.xml
          git commit -m "Publish Kujto Studio ${{ steps.version.outputs.value }} to appcast" || echo "no appcast changes"
          git push origin HEAD:main || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kujto Studio ${{ steps.version.outputs.value }}
          files: ${{ runner.temp }}/artifacts/*.pkg
